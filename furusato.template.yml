# 給与収入(源泉徴収票の"支払金額")
salaryIncome: 5000000

# 雑所得
miscellaneousIncome: 100000

# 事業所得
businessIncome: 500000

# 医療費
medicalExpenses: 150000

# 社会保険料控除
socialInsurance: 600000

# 扶養親族数(一般の控除対象扶養親族)
dependentCount: 1

# 配偶者控除の適用有無
spouseDeduction: true

# 地震保険料（控除証明書の「地震保険料の金額」または「証明額」）
earthquakeInsurance: 0

# 生命保険料（控除証明書の「証明額」または「申告額」）
# ※新制度（2012年1月1日以降の契約）のみ対応
lifeInsuranceGeneral: 0    # 一般生命保険料
lifeInsuranceMedical: 0    # 介護医療保険料
lifeInsurancePension: 0    # 個人年金保険料

# 住宅借入金等特別控除額
housingLoanDeduction: 0

# 申告方法
# electronic or paper or simple
declarationMethod: electronic
